name: release

# Tag a commit (e.g. `git tag v1.0.0 && git push --tags`) and this builds every
# supported Minecraft version and attaches all jars to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          src = open("settings.gradle.kts").read()
          block = re.search(r"versions\((.*?)\)", src, re.S).group(1)
          print("matrix=" + json.dumps(re.findall(r'"([^"]+)"', block)))
          PY

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        minecraft: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: build ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ":${{ matrix.minecraft }}:build" --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/*.jar
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: jars-*
          merge-multiple: true
          path: jars
      - name: list jars
        run: ls -la jars
      - uses: softprops/action-gh-release@v3
        with:
          files: jars/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
