name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads the version list out of settings.gradle.kts so the matrix never has to
  # be updated by hand — adding a version there is enough.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          src = open("settings.gradle.kts").read()
          block = re.search(r"versions\((.*?)\)", src, re.S).group(1)
          print("matrix=" + json.dumps(re.findall(r'"([^"]+)"', block)))
          PY
      - run: echo "Building ${{ steps.read.outputs.matrix }}"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: build ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Newest toolchain we target; Gradle provisions older JDKs itself
          # for the versions that need them.
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: build ${{ matrix.minecraft }}
        run: ./gradlew ":${{ matrix.minecraft }}:build" --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: mutetoggle-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar
          if-no-files-found: error
